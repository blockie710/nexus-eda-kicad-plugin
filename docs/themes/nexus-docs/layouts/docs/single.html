<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body class="nexus-docs">

  {{ partial "navbar.html" . }}

  <div class="nexus-layout">
    {{ partial "sidebar.html" . }}
    <main class="nexus-content">
      <header class="nexus-page-header">
        <h1>{{ .Title }}</h1>
      </header>
      {{ .Content }}
    </main>
  </div>

  {{ partial "footer.html" . }}

  {{ partial "scripts.html" . }}
</body>
</html>
